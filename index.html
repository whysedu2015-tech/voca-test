<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>단어테스트</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --bg:#f3f6fb; --card:#fff; --line:#e1e6ee; --text:#1f2933; --sub:#6b7480;
    --main:#2f6fde; --main-d:#1f56b8; --soft:#eaf1fd; --ok:#1f9d55; --bad:#d64545; --warn:#e8930c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);font-size:17px}
  .hidden{display:none !important}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:12px 18px}
  button:active{transform:scale(.98)}
  button.primary{background:var(--main);border-color:var(--main);color:#fff;font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:14px}
  h1{font-size:26px;margin:8px 0 4px;text-align:center}
  h2{font-size:20px;margin:0 0 14px}
  .sub{color:var(--sub);text-align:center;margin:0 0 22px}
  .muted{color:var(--sub);font-size:14px}
  .err{background:#fbe5e5;color:var(--bad);padding:10px 14px;border-radius:10px;margin-top:12px;font-size:15px}
  .full{width:100%}
  input.code{width:100%;font-size:28px;letter-spacing:8px;text-align:center;text-transform:uppercase;padding:14px;border:2px solid var(--line);border-radius:12px;font-weight:700}
  input.code:focus{outline:none;border-color:var(--main)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .grid button{padding:18px 10px;font-size:18px}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .topbar .grow{flex:1}
  .link{border:0;background:none;color:var(--main);padding:6px 4px;font-size:15px}

  /* 비밀번호 */
  .dots{display:flex;justify-content:center;gap:16px;margin:10px 0 24px}
  .dots span{width:20px;height:20px;border-radius:50%;border:2px solid var(--main)}
  .dots span.on{background:var(--main)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
  .pad button{font-size:26px;padding:16px 0;font-weight:600}
  .pad button.fn{font-size:16px;color:var(--sub)}

  /* 시험 목록 */
  .test{display:flex;align-items:center;gap:12px}
  .test .info{flex:1}
  .test .title{font-weight:700;font-size:18px;margin-bottom:4px}
  .badge{display:inline-block;background:var(--soft);color:var(--main-d);border-radius:99px;padding:2px 10px;font-size:13px;margin-right:4px}

  /* 문제 */
  #quiz{min-height:100vh;display:flex;flex-direction:column}
  .qhead{display:flex;align-items:center;justify-content:space-between;font-size:15px;color:var(--sub);margin-bottom:8px}
  .timer{height:10px;background:#e3e8f0;border-radius:99px;overflow:hidden;margin-bottom:20px}
  .timer div{height:100%;background:var(--main);width:100%;transition:width .1s linear}
  .timer div.low{background:var(--warn)}
  .qtype{display:inline-block;font-size:13px;color:var(--main-d);background:var(--soft);border-radius:99px;padding:3px 12px;margin-bottom:14px}
  .prompt{font-size:34px;font-weight:700;text-align:center;margin:18px 0 28px;word-break:keep-all;line-height:1.35}
  .prompt.long{font-size:22px;font-weight:600;text-align:left;line-height:1.6}
  .prompt .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--main);margin:0 4px}
  .opts{display:grid;gap:10px}
  .opts button{text-align:left;font-size:20px;padding:16px 18px;border-width:2px;line-height:1.4}
  .opts.long button{font-size:16px}
  .opts button:hover{border-color:var(--main)}
  .typein{display:flex;gap:10px}
  .typein input{flex:1;font-size:24px;padding:14px 16px;border:2px solid var(--line);border-radius:12px}
  .typein input:focus{outline:none;border-color:var(--main)}
  .speak{display:block;margin:10px auto 28px;font-size:44px;width:120px;height:120px;border-radius:50%;background:var(--soft);border:0}
  .speak:disabled{opacity:.35}

  /* 결과 */
  .score{text-align:center;padding:30px 20px}
  .score .big{font-size:64px;font-weight:800;color:var(--main);line-height:1}
  .score .of{font-size:20px;color:var(--sub);margin-top:6px}
  .wrong-item{border-top:1px solid var(--line);padding:12px 0}
  .wrong-item:first-of-type{border-top:0}
  .wrong-item .q{font-size:15px;color:var(--sub);margin-bottom:4px}
  .ans-ok{color:var(--ok);font-weight:600} .ans-bad{color:var(--bad)}
  .row{display:flex;gap:10px}
  .row button{flex:1}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(243,246,251,.75);z-index:40;color:var(--sub)}
</style>
</head>
<body>
<div id="loading" class="hidden">잠시만요…</div>

<!-- 1. 학원 코드 -->
<div id="vCode" class="wrap hidden">
  <h1>단어테스트</h1>
  <p class="sub">학원 코드를 입력하세요</p>
  <div class="card">
    <input id="codeIn" class="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button class="primary full" style="margin-top:14px" onclick="enterCode()">다음</button>
    <div id="codeErr"></div>
  </div>
</div>

<!-- 2. 반 고르기 -->
<div id="vClass" class="wrap hidden">
  <div class="topbar"><span class="grow"></span><button class="link" onclick="changeCode()">학원 코드 바꾸기</button></div>
  <h1 id="acadName"></h1>
  <p class="sub">반을 고르세요</p>
  <div class="grid" id="classGrid"></div>
</div>

<!-- 3. 이름 고르기 -->
<div id="vName" class="wrap hidden">
  <div class="topbar"><button class="link" onclick="show('vClass')">‹ 반 다시 고르기</button></div>
  <h1 id="className"></h1>
  <p class="sub">내 이름을 고르세요</p>
  <div class="grid" id="nameGrid"></div>
</div>

<!-- 4. 비밀번호 -->
<div id="vPin" class="wrap hidden">
  <div class="topbar"><button class="link" onclick="show('vName')">‹ 이름 다시 고르기</button></div>
  <h1 id="pinName"></h1>
  <p class="sub">비밀번호 4자리를 누르세요</p>
  <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>
  <div class="pad" id="pad"></div>
  <div id="pinErr" style="max-width:320px;margin:0 auto"></div>
</div>

<!-- 5. 시험 목록 -->
<div id="vTests" class="wrap hidden">
  <div class="topbar">
    <div class="grow"><b id="meName"></b> <span class="muted" id="meClass"></span></div>
    <button class="link" onclick="logout()">로그아웃</button>
  </div>
  <h2>내 시험</h2>
  <div id="testList"></div>
</div>

<!-- 6. 시험 화면 -->
<div id="vQuiz" class="hidden">
  <div class="wrap" id="quiz">
    <div class="qhead"><span id="qTitle"></span><span id="qProg"></span></div>
    <div class="timer"><div id="tBar"></div></div>
    <div><span class="qtype" id="qType"></span></div>
    <div id="qBody"></div>
  </div>
</div>

<!-- 7. 결과 -->
<div id="vResult" class="wrap hidden">
  <div class="card score">
    <div class="muted" id="rTitle"></div>
    <div class="big" id="rPct"></div>
    <div class="of" id="rScore"></div>
  </div>
  <div id="rSaveErr"></div>
  <div class="card" id="rWrongCard">
    <h2 id="rWrongTitle"></h2>
    <div id="rWrong"></div>
  </div>
  <div class="row">
    <button onclick="retry()">다시 보기</button>
    <button class="primary" onclick="backToList()">목록으로</button>
  </div>
  <button class="full" style="margin-top:10px" onclick="logout()">끝내기 (다음 학생)</button>
</div>

<script>
// ==== QUIZ-CORE START ====  (문제 만들기·채점 — 화면과 상관없는 부분)
const RATIO = { en2ko_mc: .20, ko2en_mc: .20, spelling: .20, dictation: .15, blank: .15, def: .10 };
const DEF_TYPES = ['def2en_mc', 'def_spelling', 'en2def_mc'];
const SECONDS = { def2en_mc: 25, def_spelling: 25, en2def_mc: 30 };   // 나머지는 15초
const secondsFor = type => SECONDS[type] || 15;

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = s => String(s ?? '').trim().toLowerCase().replace(/\s+/g, ' ');
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

// 예문에서 단어 자리 찾기 (가능하면 단어 경계 기준, 아니면 포함 여부)
function blankRegex(word) {
  return new RegExp('(^|[^A-Za-z])(' + escRe(word) + ')(?=$|[^A-Za-z])', 'i');
}
function canBlank(w) { return !!(w.example && blankRegex(w.word).test(w.example)); }
function makeBlank(w) { return w.example.replace(blankRegex(w.word), '$1_____'); }

// 비율대로 개수 나누기 (가장 큰 나머지 방식)
function splitCounts(n, ratio) {
  const keys = Object.keys(ratio);
  const raw = keys.map(k => ratio[k] * n);
  const out = Object.fromEntries(keys.map((k, i) => [k, Math.floor(raw[i])]));
  let left = n - Object.values(out).reduce((a, b) => a + b, 0);
  keys.map((k, i) => [k, raw[i] - Math.floor(raw[i])]).sort((a, b) => b[1] - a[1])
      .forEach(([k]) => { if (left > 0) { out[k]++; left--; } });
  return out;
}

// 보기 만들기: 정답 + 다른 단어에서 겹치지 않는 오답 3개
function makeOptions(answer, pool, getText) {
  const seen = new Set([norm(answer)]);
  const opts = [answer];
  for (const w of shuffle(pool)) {
    const t = getText(w);
    if (!t || seen.has(norm(t))) continue;
    seen.add(norm(t)); opts.push(t);
    if (opts.length === 4) break;
  }
  return shuffle(opts);
}

// 시험지 만들기
function buildQuiz(words, questionCount, canSpeak = true) {
  const n = Math.min(questionCount, words.length);
  const picked = shuffle(words).slice(0, n);
  const defWords = words.filter(w => w.definition);
  const want = splitCounts(n, RATIO);

  // 영영뜻 몫을 세 형식에 골고루 나누기 (단어→영영뜻 객관식은 영영뜻 4개 이상일 때만)
  const defTypes = DEF_TYPES.filter(t => t !== 'en2def_mc' || defWords.length >= 4);
  const defWant = {};
  shuffle(defTypes).forEach((t, i) => defWant[t] = Math.floor(want.def / defTypes.length) + (i < want.def % defTypes.length ? 1 : 0));

  // 조건이 있는 형식부터 해당 단어로 채우기
  const assign = new Map();   // word_id → type
  const free = () => picked.filter(w => !assign.has(w.id));
  const fill = (type, count, ok) => {
    for (const w of shuffle(free()).filter(ok).slice(0, count)) assign.set(w.id, type);
  };
  fill('en2def_mc',   defWant.en2def_mc   || 0, w => w.definition);
  fill('def2en_mc',   defWant.def2en_mc   || 0, w => w.definition);
  fill('def_spelling',defWant.def_spelling|| 0, w => w.definition);
  fill('blank',       want.blank,              canBlank);

  // 남은 단어는 기본 형식으로 (비율대로, 모자란 몫은 돌아가며 채움)
  const basic = canSpeak ? ['en2ko_mc', 'ko2en_mc', 'spelling', 'dictation'] : ['en2ko_mc', 'ko2en_mc', 'spelling'];
  const rest = free();
  const types = [];
  basic.forEach(t => { for (let i = 0; i < (want[t] || 0); i++) types.push(t); });
  if (!canSpeak) for (let i = 0; i < want.dictation; i++) types.push('spelling');
  let k = 0; while (types.length < rest.length) types.push(basic[k++ % basic.length]);
  const restTypes = shuffle(types).slice(0, rest.length);
  rest.forEach((w, i) => assign.set(w.id, restTypes[i]));

  // 문제 만들기
  return shuffle(picked).map((w, i) => {
    const type = assign.get(w.id);
    const q = { no: i + 1, word_id: w.id, type, word: w.word, meaning: w.meaning, example: w.example, definition: w.definition, seconds: secondsFor(type) };
    if (type === 'en2ko_mc')  { q.prompt = w.word;       q.answer = w.meaning;    q.options = makeOptions(w.meaning, words.filter(x => x.id !== w.id), x => x.meaning); }
    if (type === 'ko2en_mc')  { q.prompt = w.meaning;    q.answer = w.word;       q.options = makeOptions(w.word, words.filter(x => x.id !== w.id), x => x.word); }
    if (type === 'spelling')  { q.prompt = w.meaning;    q.answer = w.word; }
    if (type === 'dictation') { q.prompt = '';           q.answer = w.word; }
    if (type === 'blank')     { q.prompt = makeBlank(w); q.answer = w.word;       q.options = makeOptions(w.word, words.filter(x => x.id !== w.id), x => x.word); }
    if (type === 'def2en_mc') { q.prompt = w.definition; q.answer = w.word;       q.options = makeOptions(w.word, words.filter(x => x.id !== w.id), x => x.word); }
    if (type === 'def_spelling'){ q.prompt = w.definition; q.answer = w.word; }
    if (type === 'en2def_mc') { q.prompt = w.word;       q.answer = w.definition; q.options = makeOptions(w.definition, defWords.filter(x => x.id !== w.id), x => x.definition); }
    return q;
  });
}

// 채점 (서버와 같은 규칙)
function isCorrect(q, ans) {
  if (ans == null || String(ans).trim() === '') return false;
  if (q.type === 'en2ko_mc' || q.type === 'en2def_mc') return String(ans).trim() === String(q.answer).trim();
  return norm(ans) === norm(q.word);
}
// ==== QUIZ-CORE END ====

// ============================================================
// 화면
// ============================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPE_LABEL = { en2ko_mc:'알맞은 뜻 고르기', ko2en_mc:'알맞은 단어 고르기', spelling:'영어로 쓰기', dictation:'듣고 쓰기', blank:'빈칸에 알맞은 단어',
                     def2en_mc:'영영뜻 보고 단어 고르기', def_spelling:'영영뜻 보고 쓰기', en2def_mc:'알맞은 영영뜻 고르기' };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

let code = '', roster = [], pickedClass = null, pickedStudent = null, pin = '';
let session = null;          // { token, student_name, class_name, academy_name }
let current = null;          // 진행 중인 시험

const VIEWS = ['vCode','vClass','vName','vPin','vTests','vQuiz','vResult'];
function show(v) { VIEWS.forEach(x => $(x).classList.toggle('hidden', x !== v)); window.scrollTo(0, 0); }
function busy(on) { $('loading').classList.toggle('hidden', !on); }
function err(el, text) { $(el).innerHTML = text ? `<div class="err">${esc(text)}</div>` : ''; }
function errText(e) {
  const m = (e && e.message) || String(e);
  if (/SESSION_EXPIRED/.test(m)) return '접속 시간이 지났어요. 다시 로그인해 주세요.';
  if (/Failed to fetch|NetworkError|network/i.test(m)) return '인터넷 연결을 확인해 주세요.';
  return m;
}
async function rpc(name, args) {
  const { data, error } = await sb.rpc(name, args);
  if (error) {
    if (/SESSION_EXPIRED/.test(error.message)) { session = null; alertBack(); }
    throw error;
  }
  return data;
}
function alertBack() { err('pinErr', '접속 시간이 지났어요. 다시 로그인해 주세요.'); pin = ''; drawDots(); show(pickedStudent ? 'vPin' : 'vCode'); }

// ---------- 1. 학원 코드 ----------
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') enterCode(); });
async function enterCode(saved) {
  const c = (saved || $('codeIn').value).trim().toUpperCase();
  if (c.length !== 6) return err('codeErr', '학원 코드 6자리를 입력하세요.');
  busy(true);
  try {
    roster = await rpc('student_roster', { p_code: c }) || [];
    if (!roster.length) { store.del('vt_code'); show('vCode'); return err('codeErr', '학원 코드를 찾을 수 없거나 등록된 학생이 없어요.'); }
    code = c; store.set('vt_code', c); err('codeErr', '');
    $('acadName').textContent = roster[0].academy_name;
    const classes = [...new Set(roster.map(r => r.class_name))];
    $('classGrid').innerHTML = classes.map(n => `<button onclick="pickClass(this.dataset.c)" data-c="${esc(n)}">${esc(n)}</button>`).join('');
    show('vClass');
  } catch (e) { show('vCode'); err('codeErr', errText(e)); }
  finally { busy(false); }
}
function changeCode() { store.del('vt_code'); $('codeIn').value = ''; show('vCode'); $('codeIn').focus(); }

// ---------- 2·3. 반·이름 ----------
function pickClass(c) {
  pickedClass = c;
  $('className').textContent = c;
  $('nameGrid').innerHTML = roster.filter(r => r.class_name === c)
    .map(r => `<button onclick="pickStudent('${r.student_id}')">${esc(r.student_name)}</button>`).join('');
  show('vName');
}
function pickStudent(id) {
  pickedStudent = roster.find(r => r.student_id === id);
  $('pinName').textContent = pickedStudent.student_name;
  pin = ''; drawDots(); err('pinErr', '');
  show('vPin');
}

// ---------- 4. 비밀번호 ----------
$('pad').innerHTML = [1,2,3,4,5,6,7,8,9].map(n => `<button onclick="press('${n}')">${n}</button>`).join('')
  + `<button class="fn" onclick="press('clear')">지우기</button><button onclick="press('0')">0</button><button class="fn" onclick="press('back')">←</button>`;
function drawDots() { [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i < pin.length)); }
function press(k) {
  if (k === 'clear') pin = '';
  else if (k === 'back') pin = pin.slice(0, -1);
  else if (pin.length < 4) pin += k;
  drawDots();
  if (pin.length === 4) login();
}
async function login() {
  busy(true);
  try {
    const rows = await rpc('student_login', { p_code: code, p_student_id: pickedStudent.student_id, p_pin: pin });
    if (!rows || !rows.length) { pin = ''; drawDots(); return err('pinErr', '비밀번호가 틀렸어요. 다시 눌러 주세요.'); }
    session = rows[0]; err('pinErr', '');
    await loadTests();
  } catch (e) { pin = ''; drawDots(); err('pinErr', errText(e)); }
  finally { busy(false); }
}
async function logout() {
  if (session) { try { await sb.rpc('student_logout', { p_token: session.token }); } catch {} }
  session = null; current = null; pickedStudent = null; pin = '';
  if (code) enterCode(code); else show('vCode');
}

// ---------- 5. 시험 목록 ----------
async function loadTests() {
  busy(true);
  try {
    const tests = await rpc('student_tests', { p_token: session.token }) || [];
    $('meName').textContent = session.student_name;
    $('meClass').textContent = session.class_name || '';
    $('testList').innerHTML = tests.length ? tests.map(t => `
      <div class="card test">
        <div class="info">
          <div class="title">${esc(t.title)}</div>
          <span class="badge">${Math.min(t.question_count, t.word_count)}문항</span>
          <span class="badge">${t.attempt_count ? t.attempt_count + '번 봤어요' : '아직 안 봤어요'}</span>
          ${t.best_total ? `<span class="badge">최고 ${t.best_score}/${t.best_total}</span>` : ''}
        </div>
        <button class="primary" onclick="startTest('${t.test_id}', this.dataset.t)" data-t="${esc(t.title)}">${t.attempt_count ? '다시 보기' : '시작'}</button>
      </div>`).join('')
      : '<div class="card muted" style="text-align:center">지금 볼 수 있는 시험이 없어요.</div>';
    show('vTests');
  } catch (e) { err('pinErr', errText(e)); show('vPin'); }
  finally { busy(false); }
}
function backToList() { current = null; loadTests(); }

// ---------- 6. 시험 ----------
let tts = { voice: null };
const canSpeak = 'speechSynthesis' in window;
function pickVoice() {
  if (!canSpeak) return;
  const vs = speechSynthesis.getVoices();
  tts.voice = vs.find(v => /en[-_]US/i.test(v.lang) && /female|samantha|google/i.test(v.name)) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text) {
  if (!canSpeak) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.85; if (tts.voice) u.voice = tts.voice;
  speechSynthesis.speak(u);
}

async function startTest(testId, title) {
  busy(true);
  try {
    const words = await rpc('student_test_words', { p_token: session.token, p_test_id: testId }) || [];
    if (words.length < 1) throw new Error('시험 단어가 없어요. 선생님께 알려 주세요.');
    const ws = words.map(w => ({ id: w.word_id, word: w.word, meaning: w.meaning, example: w.example, definition: w.definition }));
    current = { testId, title, questions: buildQuiz(ws, words[0].question_count, canSpeak), idx: -1, answers: [], startedAt: new Date().toISOString() };
    if (canSpeak) speak(' ');   // 휴대폰에서 첫 발음이 나오도록 미리 깨우기
    $('qTitle').textContent = title;
    show('vQuiz');
    nextQ();
  } catch (e) { alert(errText(e)); }
  finally { busy(false); }
}

let timer = null, qStart = 0, replays = 0;
function nextQ() {
  clearInterval(timer);
  current.idx++;
  if (current.idx >= current.questions.length) return finish();
  const q = current.questions[current.idx];
  $('qProg').textContent = `${current.idx + 1} / ${current.questions.length}`;
  $('qType').textContent = TYPE_LABEL[q.type];
  const long = ['def2en_mc', 'def_spelling', 'blank'].includes(q.type);
  let html = '';
  if (q.type === 'dictation') {
    replays = 0;
    html = `<button class="speak" id="spk" onclick="replay()">🔊</button><p class="muted" style="text-align:center;margin-top:-16px" id="spkLeft">다시 듣기 2번</p>`;
  } else {
    const p = q.type === 'blank' ? esc(q.prompt).replace('_____', '<span class="blank">&nbsp;</span>') : esc(q.prompt);
    html = `<div class="prompt ${long ? 'long' : ''}">${p}</div>`;
  }
  if (q.options) {
    html += `<div class="opts ${q.type === 'en2def_mc' ? 'long' : ''}">` +
      q.options.map((o, i) => `<button data-i="${i}" onclick="answer(current.questions[current.idx].options[${i}])">${esc(o)}</button>`).join('') + '</div>';
  } else {
    html += `<div class="typein"><input id="typeIn" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="영어로 쓰세요">
             <button class="primary" onclick="answer($('typeIn').value)">확인</button></div>`;
  }
  $('qBody').innerHTML = html;
  const inp = $('typeIn');
  if (inp) { inp.focus(); inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) answer(inp.value); }); }
  if (q.type === 'dictation') setTimeout(() => speak(q.word), 250);

  qStart = Date.now();
  const total = q.seconds * 1000;
  const bar = $('tBar');
  bar.style.width = '100%'; bar.classList.remove('low');
  timer = setInterval(() => {
    const left = total - (Date.now() - qStart);
    bar.style.width = Math.max(0, left / total * 100) + '%';
    bar.classList.toggle('low', left < 5000);
    if (left <= 0) answer(null);
  }, 100);
}
function replay() {
  if (replays >= 2) return;
  replays++;
  speak(current.questions[current.idx].word);
  $('spkLeft').textContent = replays >= 2 ? '다시 듣기를 다 썼어요' : `다시 듣기 ${2 - replays}번`;
  if (replays >= 2) $('spk').disabled = true;
}
function answer(val) {
  if (!current || current.idx >= current.questions.length) return;
  const q = current.questions[current.idx];
  if (current.answers.length > current.idx) return;   // 두 번 눌림 방지
  clearInterval(timer);
  if (canSpeak) speechSynthesis.cancel();
  current.answers.push({ no: q.no, word_id: q.word_id, type: q.type, answer: val == null ? null : String(val).trim(), time_ms: Math.min(Date.now() - qStart, q.seconds * 1000) });
  nextQ();
}

// ---------- 7. 결과 ----------
async function finish() {
  clearInterval(timer);
  const qs = current.questions, ans = current.answers;
  const wrong = qs.map((q, i) => ({ q, a: ans[i] })).filter(x => !isCorrect(x.q, x.a.answer));
  const localScore = qs.length - wrong.length;
  $('rTitle').textContent = current.title;
  showScore(localScore, qs.length);
  $('rWrongTitle').textContent = wrong.length ? `틀린 문제 ${wrong.length}개` : '';
  $('rWrong').innerHTML = wrong.length ? wrong.map(({ q, a }) => `
    <div class="wrong-item">
      <div class="q">${q.no}. ${TYPE_LABEL[q.type]} · ${esc(questionText(q))}</div>
      <div>정답 <span class="ans-ok">${esc(q.answer)}</span></div>
      <div>내 답 <span class="ans-bad">${a.answer ? esc(a.answer) : '(시간 초과)'}</span></div>
    </div>`).join('') : '<div style="text-align:center;font-size:20px">🎉 모두 맞혔어요!</div>';
  show('vResult');
  await save();
}
function showScore(s, t) {
  $('rPct').textContent = (t ? Math.round(s / t * 100) : 0) + '점';
  $('rScore').textContent = `${t}문제 중 ${s}개 맞혔어요`;
}
function questionText(q) {
  if (q.type === 'dictation') return '(들려준 단어)';
  if (q.type === 'en2ko_mc' || q.type === 'en2def_mc') return q.word;
  return q.prompt;
}
async function save() {
  err('rSaveErr', '');
  try {
    const rows = await rpc('submit_attempt', { p_token: session.token, p_test_id: current.testId, p_answers: current.answers, p_started_at: current.startedAt });
    if (rows && rows[0]) showScore(rows[0].score, rows[0].total);   // 서버 채점 결과로 표시
    current.saved = true;
  } catch (e) {
    $('rSaveErr').innerHTML = `<div class="err">결과를 저장하지 못했어요. (${esc(errText(e))})<br>
      <button class="primary" style="margin-top:8px" onclick="save()">다시 저장하기</button></div>`;
  }
}
function retry() {
  if (current && !current.saved && !confirm('결과가 아직 저장되지 않았어요. 그래도 다시 볼까요?')) return;
  startTest(current.testId, current.title);
}

// 시험 도중 창을 닫으려 하면 경고
window.addEventListener('beforeunload', e => { if (current && current.idx < current.questions.length && current.idx >= 0 && !$('vQuiz').classList.contains('hidden')) { e.preventDefault(); e.returnValue = ''; } });

// ---------- 시작 ----------
if (!SUPABASE_KEY || SUPABASE_KEY.includes('붙여넣기')) {
  show('vCode'); err('codeErr', 'config.js에 Publishable key가 아직 없어요. 선생님께 알려 주세요.');
} else {
  const saved = store.get('vt_code');
  if (saved) { $('codeIn').value = saved; enterCode(saved); } else { show('vCode'); }
}
</script>
</body>
